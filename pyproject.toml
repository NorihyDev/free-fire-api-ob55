[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "free-fire-api-ob55"
version = "0.1.0"
description = "An unofficial, documented Free Fire player data REST API"
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pydantic-settings>=2.8,<3", "protobuf>=6.31,<8", "pycryptodome>=3.22,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1", "grpcio-tools>=1.73,<2"]

[tool.setuptools.packages.find]
include = ["freefire_api*"]

[tool.setuptools.package-data]
freefire_api = ["protocol/*.bin", "fixtures/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
