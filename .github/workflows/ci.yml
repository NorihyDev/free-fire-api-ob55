name: Check the API

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Check formatting and lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test the API and encrypted protocol
        run: python -m pytest -q
      - name: Check generated protocol descriptors
        run: |
          python scripts/compile_protocol.py
          git diff --exit-code -- freefire_api/protocol/schemas.bin
      - name: Check the Bruno demo collection
        if: matrix.python-version == '3.12'
        run: |
          python -m uvicorn freefire_api.main:app --host 127.0.0.1 --port 8000 &
          python scripts/wait_for_api.py
          cd bruno
          npx --yes --package @usebruno/cli@4.2.1 bru run --env "Local Demo"
        env:
          FF_MODE: demo
